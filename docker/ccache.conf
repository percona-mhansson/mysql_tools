# ~/.config/ccache/ccache.conf  (or $CCACHE_DIR/ccache.conf)
max_size = 30G

# Compression is on by default in ccache 4; level 1 is fast and still ~3-5x.
compression = true
compression_level = 1

# Rewrite absolute paths under here to relative ones, so the same file in
# different worktrees (vector-mvp/9.7, 8.4, ...) can hit the same cache entry.
base_dir = /home/martin/gitroot
